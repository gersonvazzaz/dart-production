              - { label: "Placeholder immagine", name: "imagePlaceholder", widget: "string", required: false }
              - { label: "Etichetta bottone", name: "buttonLabel", widget: "string" }
              - { label: "Link pagina", name: "href", widget: "hidden" }
          - label: "CTA finale"
            name: "cta"
            widget: "object"
            collapsed: true
