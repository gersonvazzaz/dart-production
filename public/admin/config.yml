backend:
  name: github
  repo: gersonvazzaz/dart-production
  branch: main
  base_url: https://dart-production.vercel.app
  auth_endpoint: api/auth

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://dart-production.vercel.app
display_url: https://dart-production.vercel.app

collections:
  - name: "pagine"
    label: "Pagine del sito"
    files:
      - name: "homepage"
        label: "Homepage"
        file: "content/homepage.md"
        format: "yaml-frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Tag", name: "tag", widget: "string" }
              - { label: "Titolo riga 1", name: "titleLine1", widget: "string" }
              - { label: "Titolo riga 2", name: "titleLine2", widget: "string" }
              - { label: "Sottotitolo", name: "subtitle", widget: "text" }
              - { label: "Bottone 1", name: "btn1", widget: "string" }
              - { label: "Bottone 2", name: "btn2", widget: "string" }
          - label: "Marquee (testo scorrevole)"
            name: "marquee"
            widget: "list"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Descrizione", name: "description", widget: "string", required: false }
              - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Chi siamo"
            name: "about"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo riga 1", name: "titleLine1", widget: "string" }
              - { label: "Titolo riga 2", name: "titleLine2", widget: "string" }
              - { label: "Paragrafo 1", name: "paragraph1", widget: "text" }
              - { label: "Paragrafo 2", name: "paragraph2", widget: "text" }
              - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Servizi"
            name: "services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - label: "Card servizi"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Icona", name: "icon", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "text" }
              - label: "Card larga"
                name: "cardWide"
                widget: "object"
                fields:
                  - { label: "Icona", name: "icon", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "text" }
          - label: "Progetti in evidenza"
            name: "projectsHighlight"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Etichetta bottone", name: "buttonLabel", widget: "string" }
              - label: "Progetto featured"
                name: "featured"
                widget: "object"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Categoria", name: "category", widget: "string" }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
              - label: "Altri progetti"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Categoria", name: "category", widget: "string" }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Metodo"
            name: "process"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - label: "Step"
                name: "steps"
                widget: "list"
                fields:
                  - { label: "Numero", name: "num", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "text" }
          - label: "Clienti"
            name: "clients"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - label: "Loghi"
                name: "logos"
                widget: "list"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "string", required: false }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Partner Stanley/Stella"
            name: "partner"
            widget: "object"
            fields:
              - { label: "Badge", name: "badge", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Paragrafo 1", name: "paragraph1", widget: "text" }
              - { label: "Paragrafo 2", name: "paragraph2", widget: "text" }
              - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "CTA finale"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo riga 1", name: "titleLine1", widget: "string" }
              - { label: "Titolo riga 2", name: "titleLine2", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone", name: "button", widget: "string" }

      - name: "studio"
        label: "Studio"
        file: "content/studio.md"
        format: "yaml-frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Sottotitolo", name: "subtitle", widget: "text" }
          - label: "Storia"
            name: "story"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo riga 1", name: "titleLine1", widget: "string" }
              - { label: "Titolo riga 2", name: "titleLine2", widget: "string" }
              - { label: "Paragrafo 1", name: "paragraph1", widget: "text" }
              - { label: "Paragrafo 2", name: "paragraph2", widget: "text" }
              - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Team"
            name: "team"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - label: "Membri"
                name: "members"
                widget: "list"
                fields:
                  - { label: "Nome", name: "name", widget: "string" }
                  - { label: "Ruolo", name: "role", widget: "string" }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Laboratorio"
            name: "lab"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Descrizione", name: "description", widget: "text" }
              - label: "Gallery"
                name: "galleryItems"
                widget: "list"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "string", required: false }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Showroom"
            name: "showroom"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Paragrafo 1", name: "paragraph1", widget: "text" }
              - { label: "Paragrafo 2", name: "paragraph2", widget: "text" }
              - { label: "Bottone", name: "button", widget: "string" }
              - { label: "Immagine", name: "image", widget: "image", required: false }
          - label: "Valori"
            name: "values"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - label: "Lista valori"
                name: "items"
                widget: "list"
                fields:
                  - { label: "Icona", name: "icon", widget: "string" }
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "text" }

      - name: "servizi"
        label: "Servizi"
        file: "content/servizi.md"
        format: "yaml-frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Sottotitolo", name: "subtitle", widget: "text" }
          - label: "Lista servizi"
            name: "items"
            widget: "list"
            fields:
              - { label: "Numero (eyebrow)", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Descrizione", name: "description", widget: "text" }
              - label: "Lista voci"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "string", required: false }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
              - { label: "Immagine", name: "image", widget: "image", required: false }
              - { label: "Sfondo", name: "bg", widget: "select", options: ["white", "light", "dark"] }
              - { label: "Layout invertito", name: "reverse", widget: "boolean", default: false }
          - label: "CTA finale"
            name: "cta"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo riga 1", name: "titleLine1", widget: "string" }
              - { label: "Titolo riga 2", name: "titleLine2", widget: "string" }
              - { label: "Testo", name: "text", widget: "text" }
              - { label: "Bottone", name: "button", widget: "string" }

      - name: "contatti"
        label: "Contatti"
        file: "content/contatti.md"
        format: "yaml-frontmatter"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Sottotitolo", name: "subtitle", widget: "text" }
          - label: "Info contatti"
            name: "info"
            widget: "object"
            fields:
              - label: "Email"
                name: "email"
                widget: "object"
                fields:
                  - { label: "Etichetta", name: "label", widget: "string" }
                  - { label: "Valore", name: "value", widget: "string" }
              - label: "Telefono"
                name: "phone"
                widget: "object"
                fields:
                  - { label: "Etichetta", name: "label", widget: "string" }
                  - label: "Numeri"
                    name: "values"
                    widget: "list"
                    field: { label: "Numero", name: "numero", widget: "string" }
              - label: "Dati aziendali"
                name: "business"
                widget: "object"
                fields:
                  - { label: "Etichetta", name: "label", widget: "string" }
                  - { label: "Riga 1", name: "line1", widget: "string" }
                  - { label: "Riga 2", name: "line2", widget: "string" }
          - label: "Form preventivo"
            name: "form"
            widget: "object"
            fields:
              - { label: "Titolo", name: "title", widget: "string" }
              - { label: "Placeholder nome", name: "namePlaceholder", widget: "string" }
              - { label: "Placeholder email", name: "emailPlaceholder", widget: "string" }
              - { label: "Placeholder messaggio", name: "messagePlaceholder", widget: "string" }
              - { label: "Bottone invio", name: "submit", widget: "string" }
              - { label: "Nota sotto form", name: "note", widget: "string" }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Brand", name: "brand", widget: "string" }
              - { label: "Descrizione brand", name: "description", widget: "text" }
              - { label: "Titolo sezione Pagine", name: "pagesTitle", widget: "string" }
              - { label: "Titolo sezione Servizi", name: "servicesTitle", widget: "string" }
              - label: "Link servizi"
                name: "servicesLinks"
                widget: "list"
                fields:
                  - { label: "Titolo", name: "title", widget: "string" }
                  - { label: "Descrizione", name: "description", widget: "string", required: false }
                  - { label: "Immagine", name: "image", widget: "image", required: false }
              - { label: "Titolo sezione Contatti", name: "contactsTitle", widget: "string" }
              - { label: "Copyright", name: "copyright", widget: "string" }
              - { label: "P.IVA footer", name: "vat", widget: "string" }
          - label: "Etichette navigazione"
            name: "nav"
            widget: "object"
            fields:
              - { label: "Home", name: "home", widget: "string" }
              - { label: "Studio", name: "studio", widget: "string" }
              - { label: "Servizi", name: "servizi", widget: "string" }
              - { label: "Progetti", name: "progetti", widget: "string" }
              - { label: "Contatti", name: "contatti", widget: "string" }

  - name: "progetti"
    label: "Progetti"
    files:
      - name: "progetti-panoramica"
